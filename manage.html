<!-- ค้นหาปุ่มเพิ่มสินค้าเดิม ในบรรทัดที่ 166 แล้วแก้โดยเพิ่ม data-role เข้าไป (เพื่อให้แคชเชียร์มองไม่เห็นปุ่มนี้) -->
<button class="btn btn-primary" id="manageAddBtn" data-role="admin,manager,stock_staff">+ เพิ่มสินค้า</button>

<!-- ======================================================= -->
<!-- ก๊อปปี้โค้ดด้านล่างนี้ ไปทับ <script> ด้านล่างสุดของหน้า manage.html -->
<!-- ======================================================= -->
<script src="app-data.js"></script>
<script>
// 1. ตรวจสอบสิทธิ์การเข้าถึงหน้านี้ (อนุญาตแค่ admin, manager, stock_staff)
requireAccess(['admin', 'manager', 'stock_staff']); 
initSidebarUser();

var CATEGORIES = ['เฟอร์นิเจอร์','เครื่องเขียน','อุปกรณ์ไฟฟ้า','บรรจุภัณฑ์'];
var editIconSvg = '<svg viewBox="0 0 18 18" fill="none"><path d="M11.5 2.5L15.5 6.5L6 16H2V12L11.5 2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
var delIconSvg = '<svg viewBox="0 0 18 18" fill="none"><path d="M3 5H15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M7 5V3.5A1 1 0 0 1 8 2.5H10A1 1 0 0 1 11 3.5V5" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 5L5 15.5A1 1 0 0 0 6 16.5H12A1 1 0 0 0 13 15.5L13.5 5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';

// ---------- วาดตารางจัดการสินค้า (อัปเดตเป็น Async เพื่อดึง API) ----------
async function renderManageTable(){
  try {
    var tbody = document.getElementById('manageTableBody');
    var noRow = tbody.querySelector('.no-results-row');
    
    // ลบข้อมูลแถวเดิมออกก่อนวาดใหม่ (ยกเว้นแถว no-results)
    tbody.querySelectorAll('tr[data-name]').forEach(tr => tr.remove());

    var products = await getProducts(); // ดึงจาก API (MySQL)
    var html = '';
    
    products.forEach(function(p){
      var status = getStockStatus(p);
      html += '<tr class="'+stockRowClass(status)+'" data-name="'+p.name+'" data-sku="'+p.sku+'" data-cat="'+p.category+'">' +
        '<td><div class="thumb"></div></td>' +
        '<td class="col-name">'+p.name+'</td>' +
        '<td class="col-muted">'+p.sku+'</td>' +
        '<td>'+p.category+'</td>' +
        '<td class="col-strong'+(status!=='ปกติ'?' danger':'')+'">'+p.qty+'</td>' +
        '<td class="col-muted">'+p.unit+'</td>' +
        '<td><span class="badge '+stockBadgeClass(status)+'">'+status+'</span></td>' +
        '<td><div class="row-actions">' +
          // 2. ใส่ data-role ให้ปุ่มแก้ไข และปุ่มลบในตาราง 
          '<button class="icon-btn" title="แก้ไข" data-role="admin,manager,stock_staff" data-action="edit" data-sku="'+p.sku+'">'+editIconSvg+'</button>' +
          '<button class="icon-btn" title="ลบ" data-role="admin,manager" data-action="delete" data-sku="'+p.sku+'">'+delIconSvg+'</button>' +
        '</div></td>' +
      '</tr>';
    });
    
    tbody.insertAdjacentHTML('afterbegin', html);
    noRow.style.display = products.length === 0 ? '' : 'none';

    // ผูก event ปุ่มแก้ไข/ลบใหม่
    tbody.querySelectorAll('[data-action="edit"]').forEach(function(btn){
      btn.addEventListener('click', function(){ openProductModal(btn.getAttribute('data-sku')); });
    });
    tbody.querySelectorAll('[data-action="delete"]').forEach(function(btn){
      btn.addEventListener('click', function(){ 
        // เปลี่ยนชื่อฟังก์ชันลบ เพื่อไม่ให้ชนกับ API
        deleteProductAction(btn.getAttribute('data-sku'), btn.closest('tr').getAttribute('data-name')); 
      });
    });

    // 3. *สำคัญ* เรียกเช็คสิทธิ์เพื่อซ่อนปุ่มหลังจากวาดตารางเสร็จ
    renderRoleUI();
    
    // เรียกฟิลเตอร์ทำงานใหม่เผื่อมีข้อความค้นหาค้างอยู่
    document.getElementById('manageSearch').dispatchEvent(new Event('input'));
    
  } catch (err) {
    showErrorToast('ดึงข้อมูลสินค้าไม่สำเร็จ: ' + err.message);
  }
}

// ---------- ฟอร์มเพิ่ม/แก้ไขสินค้า (อัปเดตเป็น Async) ----------
async function openProductModal(skuToEdit){
  var isEdit = !!skuToEdit;
  var product = null;

  if(isEdit){
    try {
      product = await getProduct(skuToEdit); // ดึงข้อมูล 1 ชิ้นจาก API
    } catch(err) {
      showErrorToast('ไม่สามารถดึงข้อมูลสินค้านี้ได้');
      return;
    }
  }

  var body = openModal(isEdit ? 'แก้ไขสินค้า' : 'เพิ่มสินค้าใหม่');

  var catOptions = CATEGORIES.map(function(c){
    return '<option value="'+c+'"'+(product && product.category===c ? ' selected':'')+'>'+c+'</option>';
  }).join('');

  body.innerHTML =
    fieldHtml('ชื่อสินค้า', '<input id="fName" style="'+inputStyle+'" value="'+(product?product.name:'')+'" />') +
    fieldHtml('รหัส SKU', '<input id="fSku" style="'+inputStyle+'" value="'+(product?product.sku:'')+'" '+(isEdit?'readonly':'')+' />') +
    fieldHtml('หมวดหมู่', '<select id="fCat" style="'+inputStyle+'">'+catOptions+'</select>') +
    fieldHtml('จำนวนคงเหลือ', '<input id="fQty" type="number" min="0" style="'+inputStyle+'" value="'+(product?product.qty:0)+'" />') +
    fieldHtml('หน่วยนับ', '<input id="fUnit" style="'+inputStyle+'" value="'+(product?product.unit:'')+'" />') +
    fieldHtml('จุดสั่งซื้อขั้นต่ำ', '<input id="fMin" type="number" min="0" style="'+inputStyle+'" value="'+(product?product.minQty:0)+'" />') +
    '<button id="fSaveBtn" class="btn btn-primary" style="justify-content:center;">'+(isEdit?'บันทึกการแก้ไข':'เพิ่มสินค้า')+'</button>';

  document.getElementById('fSaveBtn').addEventListener('click', async function(){
    var name = document.getElementById('fName').value.trim();
    var sku = document.getElementById('fSku').value.trim();
    var category = document.getElementById('fCat').value;
    var qty = parseInt(document.getElementById('fQty').value, 10) || 0;
    var unit = document.getElementById('fUnit').value.trim();
    var minQty = parseInt(document.getElementById('fMin').value, 10) || 0;

    if(!name || !sku || !unit){ showToast('กรุณากรอกข้อมูลให้ครบถ้วน'); return; }

    var btn = document.getElementById('fSaveBtn');
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึก...';

    try {
      if(isEdit){
        await updateProduct(sku, { name:name, category:category, qty:qty, unit:unit, minQty:minQty });
        await addHistory({ type:'แก้ไขข้อมูล', sku:sku, name:name, qtyText:'แก้ไขข้อมูลสินค้า', actor: currentUser() });
      } else {
        await addProduct({ sku:sku, name:name, category:category, qty:qty, unit:unit, minQty:minQty });
        await addHistory({ type:'เพิ่มสินค้า', sku:sku, name:name, qtyText:'+'+qty+' '+unit, actor: currentUser() });
      }
      closeModal();
      await renderManageTable(); // โหลดตารางใหม่
      showToast(isEdit ? 'บันทึกการแก้ไขเรียบร้อย' : 'เพิ่มสินค้าเรียบร้อย');
    } catch(err) {
      showErrorToast('บันทึกไม่สำเร็จ: ' + err.message);
      btn.disabled = false;
      btn.textContent = isEdit ? 'บันทึกการแก้ไข' : 'เพิ่มสินค้า';
    }
  });
}

// ---------- ฟังก์ชันลบสินค้า (อัปเดตเป็น Async) ----------
async function deleteProductAction(sku, name){
  if(!confirm('ยืนยันการลบสินค้านี้ออกจากระบบ?')) return;
  try {
    await deleteProduct(sku); // เรียก API ใน app-data.js
    await addHistory({ type:'ลบสินค้า', sku:sku, name:name, qtyText:'ลบสินค้าออกจากระบบ', actor: currentUser() });
    await renderManageTable();
    showToast('ลบสินค้าเรียบร้อย');
  } catch(err) {
    showErrorToast('ลบไม่สำเร็จ: ' + err.message);
  }
}

// โหลดข้อมูลครั้งแรก
renderManageTable();
document.getElementById('manageAddBtn').addEventListener('click', function(){ openProductModal(null); });
document.getElementById('manageExcelBtn').addEventListener('click', function(){
  showToast('ฟีเจอร์นำเข้า/ส่งออก Excel ยังไม่เปิดใช้งานในระบบสาธิตนี้');
});

// ฟังก์ชันค้นหาและกรอง (ใช้งานแบบเดิมได้เลย เพราะมันซ่อน/แสดง <tr>)
function setupTableFilter(searchInputId, categorySelectId, tableBodyId){
  var searchInput = document.getElementById(searchInputId);
  var tbody = document.getElementById(tableBodyId);
  var catSelect = categorySelectId ? document.getElementById(categorySelectId) : null;

  function applyFilter(){
    var term = (searchInput ? searchInput.value : '').trim().toLowerCase();
    var cat = catSelect ? catSelect.value : '';
    var rows = tbody.querySelectorAll('tr[data-name]');
    var visibleCount = 0;
    rows.forEach(function(row){
      var name = row.getAttribute('data-name').toLowerCase();
      var sku = row.getAttribute('data-sku').toLowerCase();
      var rowCat = row.getAttribute('data-cat') || '';
      var matchesTerm = !term || name.indexOf(term) !== -1 || sku.indexOf(term) !== -1;
      var matchesCat = !cat || cat === 'all' || rowCat === cat;
      var show = matchesTerm && matchesCat;
      row.style.display = show ? '' : 'none';
      if(show) visibleCount++;
    });
    var emptyRow = tbody.querySelector('.no-results-row');
    if(emptyRow) emptyRow.style.display = visibleCount === 0 ? '' : 'none';
  }

  if(searchInput) searchInput.addEventListener('input', applyFilter);
  if(catSelect) catSelect.addEventListener('change', applyFilter);

  var topSearch = document.getElementById('topSearch');
  if(topSearch && searchInput){
    topSearch.addEventListener('input', function(){
      searchInput.value = topSearch.value;
      applyFilter();
    });
  }
}

setupTableFilter('manageSearch', 'manageCategory', 'manageTableBody');

// เช็คและซ่อนปุ่ม UI ที่ด้านนอกตาราง (เช่น ปุ่ม + เพิ่มสินค้า)
renderRoleUI();
</script>
