<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>สมัครสมาชิก | ระบบจัดการสต็อกสินค้า</title>
<style>
    :root{
      --sidebar-bg:#1e293b;
      --sidebar-active-bg:rgba(255,255,255,0.14);
      --sidebar-hover-bg:rgba(255,255,255,0.08);
      --sidebar-text:rgba(255,255,255,0.62);
      --sidebar-text-active:#ffffff;
      --content-bg:#f5f6f8;
      --white:#ffffff;
      --border:#d9dbe0;
      --border-light:#edf0f2;
      --text-dark:#1e293b;
      --text-body:#292e36;
      --text-muted:#6b7582;
      --text-faint:#9ca3ad;
      --green-bg:#dbfae5; --green-text:#16a34a;
      --red-bg:#fee3e3; --red-text:#dc2626;
      --red-row:#feeded;
      --yellow-bg:#faf9db; --yellow-text:#c99a00;
      --blue-bg:#e3e9fe; --blue-text:#263edc;
      --sidebar-w:263px;
      --topbar-h:68px;
      --radius-lg:18px;
      --radius-md:10px;
      --radius-sm:8px;
      --shadow-card:0 4px 16px 0 rgba(0,0,0,0.06);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:'Inter','Noto Sans Thai',system-ui,-apple-system,sans-serif;
      background:var(--white);
      color:var(--text-body);
      -webkit-font-smoothing:antialiased;
    }
    a{text-decoration:none;color:inherit;}
    button{font-family:inherit;cursor:pointer;}
    input, select{font-family:inherit;}

    /* ---------- Login / Register ---------- */
    .login-wrap{
      min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:#fff; position:relative;
      padding:90px 20px 40px;
    }
    .login-topbar{position:absolute; top:0; left:0; right:0; height:68px; background:var(--sidebar-bg);}
    .login-box{display:flex; flex-direction:column; align-items:center; gap:16px; width:335px; max-width:90vw;}
    .login-box svg{width:84px;height:84px;}
    .login-title{font-size:19px; font-weight:700; color:var(--text-dark); margin:0 0 4px;}
    .login-field{
      width:100%; height:44px; border:1px solid var(--border); border-radius:10px;
      padding:0 16px; font-size:14px; outline:none; background-color: var(--white);
    }
    .login-field:focus{border-color:var(--text-dark);}
    .login-btn{
      width:100%; height:44px; border-radius:999px; border:none; background:#6750A4; color:#fff;
      font-weight:600; font-size:14px; margin-top:4px;
    }
    .login-btn:hover{background:#5a4590;}
    .login-btn:disabled{background:#b7abd6; cursor:default;}
    .login-error{color:var(--red-text); font-size:13px; min-height:18px; text-align:center;}
    .login-success{color:var(--green-text); font-size:13px; min-height:18px; text-align:center;}
    .login-back{font-size:13px; color:var(--text-muted);}
    .login-back a{color:#6750A4; font-weight:600;}

</style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-topbar"></div>
    <div class="login-box">
      <svg viewBox="0 0 64 64" fill="none"><rect x="6" y="26" width="52" height="30" rx="2" fill="#8FD3E8"/><rect x="6" y="46" width="52" height="10" fill="#F26D4B"/><rect x="26" y="34" width="10" height="22" fill="#5A6B7A"/><path d="M4 20L32 8L60 20L54 28H10L4 20Z" fill="#F6C143"/><rect x="4" y="20" width="56" height="6" fill="#F26D4B"/><rect x="20" y="6" width="24" height="10" fill="#FFF7E0" stroke="#1E293B" stroke-width="1.5"/><text x="32" y="14" font-family="Arial" font-weight="700" font-size="7" fill="#1E293B" text-anchor="middle">STORE</text></svg>
      <div class="login-title">สร้างบัญชีผู้ใช้ใหม่</div>

      <input class="login-field" id="regFullname" type="text" placeholder="ชื่อ-นามสกุล" autocomplete="name" />
      <input class="login-field" id="regUsername" type="text" placeholder="Username" autocomplete="username" />
      <input class="login-field" id="regPassword" type="password" placeholder="Password" autocomplete="new-password" />
      <input class="login-field" id="regPassword2" type="password" placeholder="ยืนยัน Password" autocomplete="new-password" />
      
      <!-- ช่องเลือก Role -->
      <select class="login-field" id="regRole" style="color: var(--text-body);">
        <option value="stock_staff">พนักงานคลังสินค้า</option>
        <option value="cashier">พนักงานแคชเชียร์</option>
        <option value="manager">ผู้จัดการร้าน</option>
        <option value="owner">ผู้บริหาร</option>
        <option value="admin">ผู้ดูแลระบบ</option>
      </select>

      <div class="login-error" id="regError"></div>
      <div class="login-success" id="regSuccess"></div>

      <button class="login-btn" id="regBtn">สร้างบัญชี</button>

      <div class="login-back">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></div>
    </div>
  </div>

<script src="app-data.js"></script>
<script>
if(currentUser() && localStorage.getItem(LS_TOKEN)){ window.location.href = 'home.html'; }

document.getElementById('regBtn').addEventListener('click', function(){
  var fullname  = document.getElementById('regFullname').value.trim();
  var username  = document.getElementById('regUsername').value.trim();
  var password  = document.getElementById('regPassword').value.trim();
  var password2 = document.getElementById('regPassword2').value.trim();
  var role      = document.getElementById('regRole').value; 
  var err = document.getElementById('regError');
  var ok  = document.getElementById('regSuccess');
  
  err.textContent = ''; ok.textContent = '';

  if(!fullname || !username || !password || !password2){
    err.textContent = 'กรุณากรอกข้อมูลให้ครบทุกช่อง';
    return;
  }
  if(password.length < 6){
    err.textContent = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
    return;
  }
  if(password !== password2){
    err.textContent = 'รหัสผ่านทั้งสองช่องไม่ตรงกัน';
    return;
  }

  // เด้งหน้าต่าง (Modal) ให้ Manager/Admin กรอกรหัสยืนยัน
  var modalBody = openModal('ยืนยันตัวตนผู้อนุมัติ');
  
  modalBody.innerHTML = 
    '<div style="font-size:13px; color:#6b7582; margin-bottom:8px;">การสร้างบัญชีพนักงานใหม่ จำเป็นต้องได้รับการอนุมัติจากผู้มีสิทธิ์ระดับ "ผู้จัดการ" ขึ้นไป</div>' +
    fieldHtml('Username (ผู้อนุมัติ)', '<input id="authUsername" style="'+inputStyle+'" autocomplete="off" />') +
    fieldHtml('Password (ผู้อนุมัติ)', '<input id="authPassword" type="password" style="'+inputStyle+'" autocomplete="off" />') +
    '<div id="authError" style="color:var(--red-text); font-size:13px; min-height:18px; text-align:center;"></div>' +
    '<button id="confirmAuthBtn" class="login-btn" style="width:100%;">ยืนยันและสร้างบัญชี</button>';

  document.getElementById('confirmAuthBtn').addEventListener('click', async function(){
    var authUser = document.getElementById('authUsername').value.trim();
    var authPass = document.getElementById('authPassword').value.trim();
    var authErr = document.getElementById('authError');
    var confirmBtn = document.getElementById('confirmAuthBtn');
    
    authErr.textContent = '';
    
    if(!authUser || !authPass) {
        authErr.textContent = 'กรุณากรอกข้อมูลผู้อนุมัติให้ครบถ้วน';
        return;
    }

    confirmBtn.disabled = true;
    confirmBtn.textContent = 'กำลังตรวจสอบสิทธิ์...';

    try {
      var newUserParams = { username: username, password: password, fullname: fullname, role: role };
      await doAuthorizedRegister(newUserParams, authUser, authPass);
      
      closeModal();
      ok.textContent = 'ผู้อนุมัติสำเร็จ! สร้างบัญชีเรียบร้อย กำลังพาไปหน้าล็อกอิน...';
      setTimeout(function(){
        window.location.href = 'login.html';
      }, 1500);
      
    } catch (error) {
      authErr.textContent = error.message;
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'ยืนยันและสร้างบัญชี';
    }
  });
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Enter') {
      var modalBtn = document.getElementById('confirmAuthBtn');
      if(modalBtn) modalBtn.click();
      else document.getElementById('regBtn').click();
  }
});
</script>
</body>
</html>
