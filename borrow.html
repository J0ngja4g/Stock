<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ยืมคืนสินค้า | ระบบจัดการสต็อกสินค้า</title>
<style>

    :root{
      --sidebar-bg:#1e293b;
      --sidebar-active-bg:rgba(255,255,255,0.14);
      --sidebar-hover-bg:rgba(255,255,255,0.08);
      --sidebar-text:rgba(255,255,255,0.62);
      --sidebar-text-active:#ffffff;
      --content-bg:#f5f6f8;
      --white:#ffffff;
      --border:#d9dbe0;
      --border-light:#edf0f2;
      --text-dark:#1e293b;
      --text-body:#292e36;
      --text-muted:#6b7582;
      --text-faint:#9ca3ad;
      --green-bg:#dbfae5; --green-text:#16a34a;
      --red-bg:#fee3e3; --red-text:#dc2626;
      --red-row:#feeded;
      --yellow-bg:#faf9db; --yellow-text:#c99a00;
      --blue-bg:#e3e9fe; --blue-text:#263edc;
      --sidebar-w:263px;
      --topbar-h:68px;
      --radius-lg:18px;
      --radius-md:10px;
      --radius-sm:8px;
      --shadow-card:0 4px 16px 0 rgba(0,0,0,0.06);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:'Inter','Noto Sans Thai',system-ui,-apple-system,sans-serif;
      background:var(--white);
      color:var(--text-body);
      -webkit-font-smoothing:antialiased;
    }
    a{text-decoration:none;color:inherit;}
    button{font-family:inherit;cursor:pointer;}
    input{font-family:inherit;}

    /* ---------- Layout ---------- */
    .app{min-height:100vh;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0;
      width:var(--sidebar-w);
      background:var(--sidebar-bg);
      display:flex; flex-direction:column;
      z-index:20;
    }
    .sidebar-top{
      height:70px;
      display:flex; align-items:center; gap:12px;
      padding:0 16px;
      background:rgba(217,217,217,0.08);
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .avatar{
      width:40px;height:40px;border-radius:50%;
      background:rgba(255,255,255,0.9);
      display:flex;align-items:center;justify-content:center;
      color:#1e293b; flex-shrink:0;
    }
    .avatar svg{width:22px;height:22px;}
    .sidebar-user{color:#fff;font-size:14px;font-weight:600;}
    .sidebar-user span{display:block;font-size:12px;font-weight:400;color:rgba(255,255,255,0.55);}

    .sidebar-nav{flex:1; padding:16px 0 0; overflow-y:auto;}
    .nav-item{
      display:flex; align-items:center; gap:12px;
      height:48px; margin:0 0 4px; padding:0 16px;
      color:var(--sidebar-text);
      font-size:14px; font-weight:500;
      border-radius:0;
      transition:background .15s ease, color .15s ease;
    }
    .nav-item svg{width:20px;height:20px;flex-shrink:0;}
    .nav-item:hover{background:var(--sidebar-hover-bg); color:#fff;}
    .nav-item.active{
      background:var(--sidebar-active-bg);
      color:var(--sidebar-text-active);
      font-weight:600;
      margin:0 8px 4px; border-radius:10px; width:calc(100% - 16px);
    }
    .nav-item:not(.active){margin:0 8px 4px; width:calc(100% - 16px);}

    .sidebar-footer{padding:16px; border-top:1px solid rgba(255,255,255,0.12);}
    .nav-item.logout{
      background:rgba(235,89,89,0.14);
      color:#ff8c8c; font-weight:600; margin:0; width:100%;
      border-radius:10px;
    }
    .nav-item.logout:hover{background:rgba(235,89,89,0.24);}

    .main{margin-left:var(--sidebar-w);}
    .topbar{
      position:sticky; top:0;
      height:var(--topbar-h);
      background:var(--white);
      box-shadow:0 4px 4px 0 rgba(0,0,0,0.06);
      display:flex; align-items:center; justify-content:flex-end;
      gap:16px; padding:0 32px;
      z-index:10;
    }
    .topbar-search{
      display:flex; align-items:center; gap:8px;
      width:360px; height:40px;
      border:1px solid var(--border); border-radius:10px;
      padding:0 14px; background:var(--white);
    }
    .topbar-search svg{width:18px;height:18px;color:var(--text-faint);flex-shrink:0;}
    .topbar-search input{
      border:none; outline:none; width:100%; font-size:14px; color:var(--text-body);
    }
    .topbar-search input::placeholder{color:var(--text-faint);}
    .topbar-icon-btn{
      width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
      background:var(--white); display:flex; align-items:center; justify-content:center;
      color:var(--text-muted);
    }
    .topbar-icon-btn svg{width:18px;height:18px;}

    .content{padding:24px 32px; background:var(--content-bg); min-height:calc(100vh - var(--topbar-h));}

    .page-header{
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:24px; flex-wrap:wrap; gap:12px;
    }
    .page-title{font-size:24px; font-weight:700; color:var(--text-dark); margin:0;}
    .header-actions{display:flex; gap:12px; align-items:center;}
    .btn{
      height:40px; padding:0 16px; border-radius:10px; border:none;
      font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:8px;
    }
    .btn-secondary{background:var(--white); border:1px solid #d1d6db; color:#384252; font-weight:500;}
    .btn-secondary:hover{background:#f7f8f9;}
    .btn-primary{background:var(--text-dark); color:#fff;}
    .btn-primary:hover{background:#0f1725;}

    .filter-bar{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
    .search-input{
      display:flex; align-items:center; gap:8px;
      width:360px; max-width:100%; height:40px;
      border:1px solid var(--border); border-radius:10px; padding:0 14px; background:var(--white);
    }
    .search-input svg{width:18px;height:18px;color:var(--text-faint);flex-shrink:0;}
    .search-input input{border:none; outline:none; width:100%; font-size:14px;}
    .search-input input::placeholder{color:var(--text-faint);}
    .dropdown{
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      width:180px; height:40px; border:1px solid var(--border); border-radius:10px;
      padding:0 14px; background:var(--white); font-size:14px; color:#384252; cursor:pointer;
    }
    .dropdown svg{width:16px;height:16px;color:var(--text-muted);}

    /* ---------- Card + Table ---------- */
    .card{
      background:var(--white); border-radius:var(--radius-lg);
      box-shadow:var(--shadow-card); padding:20px 24px 8px; overflow:auto;
    }
    table{width:100%; border-collapse:collapse; min-width:820px;}
    thead th{
      text-align:left; font-size:12px; font-weight:600; color:var(--text-muted);
      padding:0 0 12px; border-bottom:1px solid #e5e8eb;
    }
    tbody td{padding:12px 0; font-size:14px; border-bottom:1px solid var(--border-light); vertical-align:middle;}
    tbody tr:last-child td{border-bottom:none;}
    tbody tr.row-alert td{background:var(--red-row);}
    tbody tr.row-alert td:first-child{border-radius:10px 0 0 10px;}
    tbody tr.row-alert td:last-child{border-radius:0 10px 10px 0;}
    td.col-name{font-weight:600; color:var(--text-body);}
    td.col-muted{color:var(--text-muted);}
    td.col-strong{font-weight:600; color:var(--text-body);}
    td.col-strong.danger{color:var(--red-text);}
    .thumb{width:40px;height:40px;border-radius:8px;background:#e3e5eb;}
    .badge{
      display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px;
      font-size:12px; font-weight:600; white-space:nowrap;
    }
    .badge-green{background:var(--green-bg); color:var(--green-text);}
    .badge-red{background:var(--red-bg); color:var(--red-text);}
    .badge-yellow{background:var(--yellow-bg); color:var(--yellow-text);}
    .badge-blue{background:var(--blue-bg); color:var(--blue-text);}
    .row-actions{display:flex; gap:12px; align-items:center;}
    .icon-btn{width:18px;height:18px;color:var(--text-muted); background:none; border:none; padding:0;}
    .icon-btn:hover{color:var(--text-dark);}

    .table-footer{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 0; border-top:1px solid var(--border-light); margin-top:4px;
    }
    .pagination{display:flex; gap:6px;}
    .page-btn{
      width:32px;height:32px;border-radius:8px; border:1px solid #e0e3e5; background:#fff;
      font-size:13px; font-weight:500; color:#384252; display:flex; align-items:center; justify-content:center;
    }
    .page-btn.active{background:var(--text-dark); color:#fff; border-color:var(--text-dark);}
    .page-btn:hover:not(.active){background:#f5f6f8;}

    .empty-state{padding:60px 20px; text-align:center; color:var(--text-muted);}
    .empty-state svg{width:48px;height:48px;color:#c9ced4; margin-bottom:12px;}

    /* ---------- Dashboard cards ---------- */
    .alert-banner{
      background:#ff7171; border-radius:20px; padding:16px 24px;
      display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px;
    }
    .alert-left{display:flex; align-items:center; gap:14px;}
    .alert-icon{
      width:36px;height:36px;border-radius:10px; background:rgba(255,255,255,0.35);
      display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    }
    .alert-icon svg{width:20px;height:20px;}
    .alert-text{color:#fff; font-weight:600; font-size:14px;}
    .alert-sub{
      display:inline-block; margin-top:4px; background:rgba(255,255,255,0.55);
      color:#7a1f1f; font-size:11px; font-weight:700; padding:2px 10px; border-radius:999px;
    }
    .alert-btn{
      background:rgba(255,255,255,0.9); color:#c33; border:none; height:36px; padding:0 16px;
      border-radius:999px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px;
    }
    .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
    .stat-card{
      border-radius:15px; padding:20px; color:#fff; min-height:120px;
      display:flex; flex-direction:column; justify-content:center; gap:6px;
    }
    .stat-card.orange{background:#f5893c;}
    .stat-card.gray{background:#c7cbd1;}
    .stat-title{font-size:15px; font-weight:500; opacity:.95;}
    .stat-value{font-size:22px; font-weight:700;}
    @media (max-width:1100px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }

    /* ---------- Login ---------- */
    .login-wrap{
      min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:#fff; position:relative;
    }
    .login-topbar{position:absolute; top:0; left:0; right:0; height:68px; background:var(--sidebar-bg);}
    .login-box{display:flex; flex-direction:column; align-items:center; gap:20px; width:335px; max-width:90vw;}
    .login-box svg{width:110px;height:110px;}
    .login-field{
      width:100%; height:44px; border:1px solid var(--border); border-radius:10px;
      padding:0 16px; font-size:14px; outline:none;
    }
    .login-field:focus{border-color:var(--text-dark);}
    .login-btn{
      width:100px; height:44px; border-radius:999px; border:none; background:#6750A4; color:#fff;
      font-weight:600; font-size:14px; margin-top:4px;
    }
    .login-btn:hover{background:#5a4590;}
    .login-error{color:var(--red-text); font-size:13px; min-height:18px;}

    /* ---------- Mobile ---------- */
    .menu-toggle{display:none;}
    @media (max-width:900px){
      .sidebar{transform:translateX(-100%); transition:transform .2s ease;}
      .sidebar.open{transform:translateX(0);}
      .main{margin-left:0;}
      .menu-toggle{
        display:flex; align-items:center; justify-content:center; width:38px;height:38px;
        border-radius:10px; border:1px solid var(--border); background:#fff; margin-right:auto;
      }
      .topbar{padding:0 16px;}
      .topbar-search{width:auto; flex:1;}
      .content{padding:16px;}
      .stat-grid{grid-template-columns:1fr 1fr;}
      .page-header{align-items:flex-start;}
    }


</style>
</head>

<script>
function changePage(dir){
  var btns = document.querySelectorAll('.pagination .page-btn');
  var nums = Array.prototype.slice.call(btns, 1, btns.length-1);
  var activeIdx = nums.findIndex(b => b.classList.contains('active'));
  var next = activeIdx + dir;
  if(next < 0 || next >= nums.length) return;
  nums[activeIdx].classList.remove('active');
  nums[next].classList.add('active');
}
document.querySelectorAll('.pagination .page-btn').forEach(function(btn, idx){
  if(idx>0 && idx < document.querySelectorAll('.pagination .page-btn').length-1){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.pagination .page-btn.active').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  }
});
</script>

initSidebarUser();

// ลำดับสถานะของคำขอยืม-คืน และคำที่ใช้เรียกปุ่ม "ไปขั้นตอนถัดไป" ของแต่ละสถานะ
var BORROW_FLOW = ['รอการตอบรับ','ส่งคำขอสำเร็จ','รอส่งมอบสินค้า','ส่งมอบสินค้าสำเร็จ','รอคืนสินค้า','คืนสำเร็จ'];
var NEXT_STEP_LABEL = {
  'รอการตอบรับ':'ยืนยันคำขอ',
  'ส่งคำขอสำเร็จ':'เตรียมส่งมอบสินค้า',
  'รอส่งมอบสินค้า':'ส่งมอบสินค้า',
  'ส่งมอบสินค้าสำเร็จ':'แจ้งขอคืนสินค้า',
  'รอคืนสินค้า':'รับคืนสินค้าเข้าสต็อก'
};

// ---------- วาดตารางคำขอยืม-คืน ----------
function renderBorrowTable(){
  var tbody = document.getElementById('borrowTableBody');
  var noRow = tbody.querySelector('.no-results-row');
  var borrows = getBorrows();
  var html = '';
  borrows.forEach(function(b){
    html += '<tr class="'+(b.status==='รอคืนสินค้า'?'row-alert':'')+'" data-name="'+b.name+'" data-sku="'+b.sku+'" data-cat="'+b.category+'" data-status="'+b.status+'">' +
      '<td><div class="thumb"></div></td>' +
      '<td class="col-name">'+b.name+'</td>' +
      '<td class="col-muted">'+b.sku+'</td>' +
      '<td>'+b.category+'</td>' +
      '<td class="col-strong">'+b.qty+'</td>' +
      '<td class="col-muted">'+b.unit+'</td>' +
      '<td><span class="badge '+BORROW_BADGE[b.status]+'">'+b.status+'</span></td>' +
      '<td><button class="icon-btn" title="รายละเอียด" data-action="detail" data-id="'+b.id+'"><svg viewBox="0 0 18 18" fill="none"><circle cx="4" cy="9" r="1.4" fill="currentColor"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="14" cy="9" r="1.4" fill="currentColor"/></svg></button></td>' +
    '</tr>';
  });
  tbody.insertAdjacentHTML('afterbegin', html);
  noRow.style.display = 'none';

  tbody.querySelectorAll('[data-action="detail"]').forEach(function(btn){
    btn.addEventListener('click', function(){ openBorrowDetail(btn.getAttribute('data-id')); });
  });
}
renderBorrowTable();

// ---------- Modal รายละเอียดคำขอ + ปุ่มเดินหน้า/ยกเลิก ----------
function openBorrowDetail(id){
  var borrows = getBorrows();
  var b = borrows.find(function(x){ return x.id === id; });
  if(!b) return;
  var body = openModal('รายละเอียดคำขอยืม-คืน');

  var html = '<div style="font-size:14px;line-height:1.9;color:#292e36;">' +
    '<div><b>สินค้า:</b> '+b.name+' ('+b.sku+')</div>' +
    '<div><b>จำนวน:</b> '+b.qty+' '+b.unit+'</div>' +
    '<div><b>ผู้ขอยืม:</b> '+b.borrower+'</div>' +
    '<div><b>วันที่ขอ:</b> '+b.date+'</div>' +
    '<div><b>สถานะปัจจุบัน:</b> <span class="badge '+BORROW_BADGE[b.status]+'">'+b.status+'</span></div>' +
    '</div>';
  body.innerHTML = html;

  var nextLabel = NEXT_STEP_LABEL[b.status];
  if(nextLabel){
    var nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-primary';
    nextBtn.style.justifyContent = 'center';
    nextBtn.textContent = nextLabel;
    nextBtn.addEventListener('click', function(){ advanceBorrowStatus(b.id); });
    body.appendChild(nextBtn);
  }
  if(b.status === 'รอการตอบรับ'){
    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-secondary';
    cancelBtn.style.justifyContent = 'center';
    cancelBtn.textContent = 'ยกเลิกคำขอ';
    cancelBtn.addEventListener('click', function(){ cancelBorrow(b.id); });
    body.appendChild(cancelBtn);
  }
}

// ---------- เดินหน้าสถานะคำขอ 1 ขั้น (ตัด/คืนสต็อกในขั้นที่เกี่ยวข้อง) ----------
function advanceBorrowStatus(id){
  var borrows = getBorrows();
  var b = borrows.find(function(x){ return x.id === id; });
  if(!b) return;
  var idx = BORROW_FLOW.indexOf(b.status);
  var nextStatus = BORROW_FLOW[idx+1];
  if(!nextStatus) return;

  if(nextStatus === 'ส่งมอบสินค้าสำเร็จ'){
    // ขั้นตอนส่งมอบสินค้าจริง: ตัดสต็อกออก
    var products = getProducts();
    var product = products.find(function(p){ return p.sku === b.sku; });
    if(!product || product.qty < b.qty){
      showToast('สต็อกไม่พอสำหรับส่งมอบ ('+(product?product.qty:0)+' '+b.unit+' คงเหลือ)');
      return;
    }
    product.qty -= b.qty;
    saveProducts(products);
    addHistory({ type:'ยืมสินค้า', sku:b.sku, name:b.name, qtyText:'-'+b.qty+' '+b.unit, actor: b.borrower });
  }
  if(nextStatus === 'คืนสำเร็จ'){
    // รับคืนเข้าสต็อก
    var products2 = getProducts();
    var product2 = products2.find(function(p){ return p.sku === b.sku; });
    if(product2){ product2.qty += b.qty; saveProducts(products2); }
    addHistory({ type:'คืนสินค้า', sku:b.sku, name:b.name, qtyText:'+'+b.qty+' '+b.unit, actor: b.borrower });
  }

  b.status = nextStatus;
  saveBorrows(borrows);
  closeModal();
  renderBorrowTable();
  showToast('อัปเดตสถานะเป็น "'+nextStatus+'" เรียบร้อย');
}

function cancelBorrow(id){
  if(!confirm('ยืนยันการยกเลิกคำขอยืมนี้?')) return;
  var borrows = getBorrows().filter(function(b){ return b.id !== id; });
  saveBorrows(borrows);
  closeModal();
  renderBorrowTable();
  showToast('ยกเลิกคำขอเรียบร้อย');
}

// ---------- สร้างคำขอยืมใหม่ ----------
document.getElementById('borrowAddBtn').addEventListener('click', function(){
  var products = getProducts().filter(function(p){ return p.qty > 0; });
  var body = openModal('สร้างคำขอยืมสินค้า');
  var options = products.map(function(p){ return '<option value="'+p.sku+'">'+p.name+' ('+p.sku+') — คงเหลือ '+p.qty+' '+p.unit+'</option>'; }).join('');

  body.innerHTML =
    fieldHtml('สินค้า', '<select id="bSku" style="'+inputStyle+'">'+options+'</select>') +
    fieldHtml('จำนวนที่ต้องการยืม', '<input id="bQty" type="number" min="1" value="1" style="'+inputStyle+'" />') +
    fieldHtml('ชื่อผู้ขอยืม', '<input id="bBorrower" style="'+inputStyle+'" placeholder="ชื่อ-นามสกุล" />') +
    '<button id="bSaveBtn" class="btn btn-primary" style="justify-content:center;">ส่งคำขอ</button>';

  document.getElementById('bSaveBtn').addEventListener('click', function(){
    var sku = document.getElementById('bSku').value;
    var qty = parseInt(document.getElementById('bQty').value, 10) || 0;
    var borrower = document.getElementById('bBorrower').value.trim();
    var product = products.find(function(p){ return p.sku === sku; });
    if(!product || qty <= 0 || !borrower){ showToast('กรุณากรอกข้อมูลให้ครบถ้วน'); return; }
    if(qty > product.qty){ showToast('จำนวนที่ขอยืมมากกว่าสต็อกคงเหลือ'); return; }

    var borrows = getBorrows();
    borrows.unshift({
      id: 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      sku: product.sku, name: product.name, category: product.category,
      qty: qty, unit: product.unit, status: 'รอการตอบรับ',
      borrower: borrower, date: formatNowThai().split(' ')[0]
    });
    saveBorrows(borrows);
    closeModal();
    renderBorrowTable();
    showToast('ส่งคำขอยืมเรียบร้อย');
  });
});

function setupTableFilter(searchInputId, categorySelectId, tableBodyId){
  var searchInput = document.getElementById(searchInputId);
  var tbody = document.getElementById(tableBodyId);
  var catSelect = categorySelectId ? document.getElementById(categorySelectId) : null;

  function applyFilter(){
    var term = (searchInput ? searchInput.value : '').trim().toLowerCase();
    var cat = catSelect ? catSelect.value : '';
    var rows = tbody.querySelectorAll('tr[data-name]');
    var visibleCount = 0;
    rows.forEach(function(row){
      var name = row.getAttribute('data-name').toLowerCase();
      var sku = row.getAttribute('data-sku').toLowerCase();
      var rowCat = row.getAttribute('data-cat') || '';
      var matchesTerm = !term || name.indexOf(term) !== -1 || sku.indexOf(term) !== -1;
      var matchesCat = !cat || cat === 'all' || rowCat === cat;
      var show = matchesTerm && matchesCat;
      row.style.display = show ? '' : 'none';
      if(show) visibleCount++;
    });
    var emptyRow = tbody.querySelector('.no-results-row');
    if(emptyRow) emptyRow.style.display = visibleCount === 0 ? '' : 'none';
  }

  if(searchInput) searchInput.addEventListener('input', applyFilter);
  if(catSelect) catSelect.addEventListener('change', applyFilter);

  // sync main topbar search box too
  var topSearch = document.getElementById('topSearch');
  if(topSearch && searchInput){
    topSearch.addEventListener('input', function(){
      searchInput.value = topSearch.value;
      applyFilter();
    });
  }
}

function toggleDropdownOptions(selectEl){
  selectEl.style.display = selectEl.style.display === 'block' ? 'none' : 'block';
}

setupTableFilter('borrowSearch', null, 'borrowTableBody');
document.getElementById('borrowStatus').addEventListener('change', function(){
  var val = this.value;
  var rows = document.querySelectorAll('#borrowTableBody tr[data-name]');
  rows.forEach(function(row){
    var status = row.getAttribute('data-status');
    row.style.display = (val === 'all' || status === val) ? '' : 'none';
  });
});

</script>
